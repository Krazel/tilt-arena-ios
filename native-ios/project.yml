name: TiltArena
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  TiltArena:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmkr.tiltarena
        PRODUCT_NAME: TiltArena
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
  TiltArenaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TiltArena
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TiltArenaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TiltArena
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TiltArena:
    build:
      targets:
        TiltArena: all
    test:
      targets:
        - TiltArenaTests
        - TiltArenaUITests
