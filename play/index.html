<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tilt Arena · Ink Tide</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--paper:#eee4c9;--accent:#c79a49;--panel:#201f1c}
*{box-sizing:border-box}body{margin:0;background:#292720;color:var(--paper);font:16px system-ui,sans-serif;overflow:hidden;display:grid;place-items:center;height:100dvh}
#stage{position:relative;isolation:isolate;overflow:hidden;width:min(100vw,217.4129353234dvh);height:min(45.995423341vw,100dvh)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#ui{position:absolute;inset:0;width:874px;height:402px;transform:scale(var(--display-scale,1));transform-origin:top left;pointer-events:none}
#ui[data-theme="classic"]{--paper:#f0f5d9;--accent:#d5f56b;--panel:#131f0e}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer}button:hover{filter:brightness(1.12)}button:focus-visible{outline:2px solid var(--paper);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}
#score,#best,#combo{position:absolute;background:#181817;border-radius:0;outline:0.628125px solid #c79a498c;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#score{left:74.5625px;top:6.28125px;width:125.625px;height:18.84375px;padding-left:3.76875px;font-size:13.81875px;line-height:18.84375px}
#best{left:616.025px;top:6.28125px;width:143.2125px;height:18.84375px;padding-right:3.76875px;text-align:right;font-size:10.05px;line-height:18.84375px}
#combo{left:74.5625px;top:370.69375px;width:169.59375px;height:23.240625px;padding:0 3.76875px;font-size:11.30625px;line-height:18.84375px}
#combo-bar{position:absolute;left:3.76875px;top:18.528125px;width:150.75px;height:1.884375px;background:var(--accent);transform-origin:left}
#ui[data-theme="classic"] #score,#ui[data-theme="classic"] #best,#ui[data-theme="classic"] #combo{background:#131f0e;outline-color:#d5f56b8c}
#overlay{position:absolute;inset:0;background:#0004;pointer-events:auto}
.card{position:absolute;left:74px;top:11px;width:726px;height:360px;padding:22px;border-radius:24px;background:var(--panel);outline:1px solid #c79a4970;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:url('/ink-tide-arena.png') center/cover;opacity:.065}
.card::after{content:"";position:absolute;inset:2px;border:1px solid #eee4c95c;border-radius:21px;pointer-events:none;filter:url('#ink-edge')}
#ui[data-theme="classic"] .card{border-color:#d5f56b4d;background:#131f0ef5}#ui[data-theme="classic"] .card::before,#ui[data-theme="classic"] .card::after{display:none}
.columns{display:grid;grid-template-columns:329px 1px 300px;gap:26px;align-items:center}
.main{display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center;min-height:236px}
.eyebrow{color:var(--accent);letter-spacing:4px;font-size:10px;font-weight:800;line-height:12px;text-transform:uppercase}
h1{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:46px;margin:0}#ui[data-theme="inkTide"] h1{font-family:Georgia,serif;font-weight:900}
#subtitle{font-size:15px;line-height:18px;color:#ffffffb3;margin:0}#menu-best{font:16px/20px ui-monospace,monospace}
.primary{height:44px;background:var(--accent);color:#11140e;font-size:17px;font-weight:750;border-radius:12px;position:relative;isolation:isolate}
#ui[data-theme="inkTide"] .primary::before{content:"";position:absolute;inset:0;background:url('/ink-tide-arena.png') center/cover;opacity:.06;border-radius:inherit;z-index:-1}
.secondary{height:38px;background:#ffffff0f;color:var(--paper);font-size:15px;font-weight:600;border-radius:10px}
#finish{font-size:12px;color:#ffffffa6;align-self:center;padding:0}#error{color:#ffb594;font-size:12px;margin:0;line-height:17px}#error:empty{display:none}
.divider{width:1px;height:236px;background:var(--accent);opacity:.22}
.settings{display:flex;flex-direction:column;gap:8px;align-self:start}
.theme-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;height:34px}.theme-row .label{margin-right:auto;font-size:9px;letter-spacing:1px}
.label{font-size:10px;font-weight:750;letter-spacing:2px;color:var(--accent);line-height:12px}.theme-row button{height:34px;border-radius:9px;background:#ffffff0f;font-size:11px;font-weight:650;padding:0 9px}
.theme-row button[aria-pressed="true"]{color:#0e140a;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tile{height:67px;background:#ffffff12;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:600;color:#ffffffbf}
.tile svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#controls{font-size:12px;line-height:16px;color:#ffffffb3;margin:0;min-height:34px}
.sound-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;height:36px;font-size:12px;color:#ffffffa6}#sound{color:var(--accent);font-size:12px;height:36px;padding:0;display:flex;align-items:center;gap:7px}#sound svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
#ui[data-phase="gameOver"] h1{font-size:28px;line-height:34px}#ui[data-phase="gameOver"] #menu-best{font-size:38px;line-height:46px;font-weight:900;color:var(--accent)}
</style><link rel="stylesheet" href="/menu.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="ink-edge"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<main id="stage"><canvas id="arena" tabindex="0" aria-label="Tilt Arena"></canvas><div id="ui" data-theme="inkTide" data-phase="menu">
<output id="score">0</output><span id="best"></span>
<div id="combo"><span id="combo-text"></span><div id="combo-bar"></div></div>
<section id="overlay" aria-labelledby="title"><div class="card"><div class="panel-art" aria-hidden="true"></div><div class="columns">
<div class="main"><span class="eyebrow">Krazel Games</span><h1 id="title">CLASSIC</h1><p id="subtitle"></p><output id="menu-best"></output><button id="play" class="primary" disabled>Loading…</button><button id="calibrate" class="secondary"></button><button id="fullscreen" class="secondary" hidden></button><div id="run-actions" hidden><button id="restart" class="secondary" hidden></button><button id="menu" class="secondary" hidden></button></div><p id="error" role="status"></p></div>
<div class="divider"></div><div class="settings">

<div class="posture-block"><span class="label" id="controls-label"></span><div class="tiles">
<button id="posture-custom" class="tile" aria-pressed="true"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10"/><path d="M14 0v8m0 12v8M0 14h8m12 0h8"/></svg><span id="custom-label"></span></button>
<button id="posture-normal" class="tile" aria-pressed="false"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="7" y="1" width="14" height="26" rx="2"/><path d="M12 4h4m-4 20h4"/></svg><span id="normal-label"></span></button>
<button id="posture-inclined" class="tile" aria-pressed="false"><svg viewBox="0 0 34 28" aria-hidden="true"><path d="m10 11-4 12h22l-4-12H10zm3 3h8M3 12q-5 4 0 7m28-7q5 4 0 7M6 9q-9 6-4 13m26-13q9 6 4 13"/></svg><span id="inclined-label"></span></button>
</div><p id="controls"></p><p id="posture-hint"></p></div>
<div class="sound-row"><span id="sound-label"></span><button id="sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM16 8q5 4 0 8M19 4q8 8 0 16"/></svg><span id="sound-value"></span></button></div>
<div id="mode-choice" class="mode-choice" role="group" aria-labelledby="mode-label"><span class="label" id="mode-label"></span><div class="mode-buttons"><button id="mode-classic" aria-pressed="true"></button><button id="mode-hard" aria-pressed="false"></button></div><p id="mode-description"></p></div>
</div></div></div></section><section id="run-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-question" aria-describedby="confirm-message" hidden><div class="confirm-card"><h2 id="confirm-question"></h2><p id="confirm-message"></p><div><button id="confirm-cancel"></button><button id="confirm-accept"></button></div></div></section><div id="theme-preview" role="group" aria-labelledby="theme-label"><span id="theme-label" hidden></span><button id="theme-classic" aria-pressed="false">Original</button><span aria-hidden="true">·</span><button id="theme-inkTide" aria-pressed="true">Ink Tide</button></div></div></main>
<script src="/core.js"></script><script type="module" src="/menu-components.js"></script><script type="module" src="/game.js"></script></body></html>
