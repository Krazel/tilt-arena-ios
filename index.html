<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tilt Arena" />
    <title>Tilt Arena</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Game arena" data-i18n-aria="arena"></canvas>

      <header class="hud hud-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <strong>Tilt Arena</strong>
            <small id="controlText">Keyboard / mouse</small>
          </div>
        </div>
        <button id="pauseButton" class="icon-button" type="button" aria-label="Pause" data-i18n-aria="pause"></button>
      </header>

      <section class="hud scorebar" aria-live="polite">
        <div><span data-i18n="score">Score</span><strong id="scoreText">0</strong></div>
        <div><span data-i18n="combo">Combo</span><strong id="comboText">x1</strong></div>
        <div><span data-i18n="time">Time</span><strong id="timeText">0:00</strong></div>
        <div><span data-i18n="best">Best</span><strong id="bestText">0</strong></div>
      </section>

      <section class="hud powerbar" id="powerBar" aria-label="Active powers" data-i18n-aria="activePowers"></section>

      <section id="startPanel" class="panel start-panel">
        <span class="eyebrow">Tilt Arena</span>
        <h1 data-i18n="startTitle">Dodge the dots</h1>
        <p>
          <span data-i18n="startCopy">Tilt the phone or drag to move the arrow. Touching an enemy ends the run. Collect orbs to activate powers.</span>
        </p>
        <div class="actions">
          <button id="startButton" class="primary" type="button" onclick="window.queueTiltArenaStart?.()" data-i18n="start">Start</button>
          <button id="tiltButton" class="secondary" type="button" onclick="window.enableTiltArena?.()" data-i18n="enableTilt">Enable tilt</button>
        </div>
      </section>

      <section id="pausePanel" class="panel pause-panel" hidden>
        <span class="eyebrow" data-i18n="pause">Pause</span>
        <h2 data-i18n="runPaused">Run paused</h2>
        <div class="actions">
          <button id="resumeButton" class="primary" type="button" onclick="window.resumeTiltArena?.()" data-i18n="resume">Resume</button>
          <button id="newRunButton" class="secondary" type="button" onclick="window.startTiltArena?.()" data-i18n="restart">Restart</button>
        </div>
      </section>

      <section id="gameOverPanel" class="panel game-over-panel" hidden>
        <span class="eyebrow" data-i18n="gameOver">Game over</span>
        <h2 id="finalTitle" data-i18n="fallen">You fell</h2>
        <div class="summary">
          <div><span data-i18n="points">Points</span><strong id="finalScore">0</strong></div>
          <div><span data-i18n="maxCombo">Max combo</span><strong id="finalCombo">x1</strong></div>
          <div><span data-i18n="time">Time</span><strong id="finalTime">0:00</strong></div>
        </div>
        <button id="restartButton" class="primary" type="button" onclick="window.startTiltArena?.()" data-i18n="playAgain">Play again</button>
      </section>

      <div class="tilt-pad" id="tiltPad" aria-hidden="true">
        <i id="tiltStick"></i>
      </div>
    </main>

    <script>
      window.__tiltArenaBootClicks = 0;
      window.__tiltArenaPendingStart = false;
      window.queueTiltArenaStart = function () {
        window.__tiltArenaBootClicks += 1;
        window.__tiltArenaPendingStart = true;
        var panel = document.querySelector("#startPanel");
        if (panel) panel.hidden = true;
        if (typeof window.startTiltArena === "function") window.startTiltArena();
      };
      document.addEventListener(
        "pointerup",
        function (event) {
          if (event.target && event.target.id === "startButton") window.queueTiltArenaStart();
        },
        true
      );
      document.addEventListener(
        "keydown",
        function () {
          if (!document.querySelector("#startPanel")?.hidden) window.queueTiltArenaStart();
        },
        true
      );
    </script>
    <script defer src="app.js?v=15"></script>
  </body>
</html>
