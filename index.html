<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tilt Arena" />
    <title>Tilt Arena</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Arena de juego"></canvas>

      <header class="hud hud-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <strong>Tilt Arena</strong>
            <small id="controlText">Teclado / raton</small>
          </div>
        </div>
        <button id="pauseButton" class="icon-button" type="button" aria-label="Pausar"></button>
      </header>

      <section class="hud scorebar" aria-live="polite">
        <div><span>Score</span><strong id="scoreText">0</strong></div>
        <div><span>Combo</span><strong id="comboText">x1</strong></div>
        <div><span>Time</span><strong id="timeText">0:00</strong></div>
        <div><span>Record</span><strong id="bestText">0</strong></div>
      </section>

      <section class="hud powerbar" id="powerBar" aria-label="Power-ups activos"></section>

      <section id="startPanel" class="panel start-panel">
        <span class="eyebrow">Tilt Arena</span>
        <h1>Evita los puntos</h1>
        <p>
          Inclina el movil o arrastra para mover la flecha. Un toque con un enemigo acaba la partida.
          Recoge circulos para activar poderes.
        </p>
        <div class="actions">
          <button id="startButton" class="primary" type="button" onclick="window.queueTiltArenaStart?.()">Empezar</button>
          <button id="tiltButton" class="secondary" type="button" onclick="window.enableTiltArena?.()">Activar inclinacion</button>
        </div>
      </section>

      <section id="pausePanel" class="panel pause-panel" hidden>
        <span class="eyebrow">Pausa</span>
        <h2>Run detenida</h2>
        <div class="actions">
          <button id="resumeButton" class="primary" type="button" onclick="window.resumeTiltArena?.()">Continuar</button>
          <button id="newRunButton" class="secondary" type="button" onclick="window.startTiltArena?.()">Reiniciar</button>
        </div>
      </section>

      <section id="gameOverPanel" class="panel game-over-panel" hidden>
        <span class="eyebrow">Fin de partida</span>
        <h2 id="finalTitle">Has caido</h2>
        <div class="summary">
          <div><span>Puntos</span><strong id="finalScore">0</strong></div>
          <div><span>Combo max</span><strong id="finalCombo">x1</strong></div>
          <div><span>Tiempo</span><strong id="finalTime">0:00</strong></div>
        </div>
        <button id="restartButton" class="primary" type="button" onclick="window.startTiltArena?.()">Otra partida</button>
      </section>

      <div class="tilt-pad" id="tiltPad" aria-hidden="true">
        <i id="tiltStick"></i>
      </div>
    </main>

    <script>
      window.__tiltArenaBootClicks = 0;
      window.__tiltArenaPendingStart = false;
      window.queueTiltArenaStart = function () {
        window.__tiltArenaBootClicks += 1;
        window.__tiltArenaPendingStart = true;
        var panel = document.querySelector("#startPanel");
        if (panel) panel.hidden = true;
        if (typeof window.startTiltArena === "function") window.startTiltArena();
      };
      document.addEventListener(
        "pointerup",
        function (event) {
          if (event.target && event.target.id === "startButton") window.queueTiltArenaStart();
        },
        true
      );
      document.addEventListener(
        "keydown",
        function () {
          if (!document.querySelector("#startPanel")?.hidden) window.queueTiltArenaStart();
        },
        true
      );
    </script>
    <script defer src="app.js?v=15"></script>
  </body>
</html>
