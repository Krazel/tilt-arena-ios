name: Verify classic iOS candidate
on:
  workflow_dispatch:
    inputs:
      death_only:
        description: Verify death animation before results and immediate restart
        type: boolean
        default: false
      laser_trial_only:
        description: 'Laser trial selector, three visual styles and approved death'
        required: false
        default: false
        type: boolean
      area_effects_only:
        description: 'Native units and approved area VFX captures'
        required: false
        default: false
        type: boolean
      menu_effects_only:
        description: Verify compact posture menus, localization and complete radial effects
        type: boolean
        default: false
      engine_only:
        description: Native unit checks after an already reviewed rendering change
        type: boolean
        default: false
      controls_only:
        description: Verify calibration, saved posture and pause/resume
        type: boolean
        default: false
      audio_only:
        description: Verify audio resources, lifecycle and localized credits
        type: boolean
        default: false
      visual_only:
        description: Recheck native visual rendering after an already verified simulation change
        type: boolean
        default: false
      hud_only:
        description: Focused native HUD, theme switching and difficulty selection checks
        type: boolean
        default: false
      gameplay_only:
        description: Check frozen enemies, fire recovery and Hard opening
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen
      - run: bash scripts/verify-ios.sh
        env:
          QA_DEATH_ONLY: ${{ inputs.death_only }}
          QA_LASER_TRIAL_ONLY: ${{ inputs.laser_trial_only }}
          QA_CONTROLS_ONLY: ${{ inputs.controls_only }}
          QA_MENU_EFFECTS_ONLY: ${{ inputs.menu_effects_only }}
          QA_AREA_EFFECTS_ONLY: ${{ inputs.area_effects_only }}
          QA_ENGINE_ONLY: ${{ inputs.engine_only }}
          QA_AUDIO_ONLY: ${{ inputs.audio_only }}
          QA_VISUAL_ONLY: ${{ inputs.visual_only }}
          QA_HUD_ONLY: ${{ inputs.hud_only }}
          QA_GAMEPLAY_ONLY: ${{ inputs.gameplay_only }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-simulator-${{ github.sha }}
          path: artifacts/ios-verification/
          retention-days: 7
