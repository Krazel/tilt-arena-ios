name: Verify classic iOS candidate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: brew install xcodegen
      - run: bash scripts/verify-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-0.2.0-build2-simulator-${{ github.sha }}
          path: artifacts/ios-verification/
          retention-days: 7
