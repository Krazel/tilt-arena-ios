name: Verify classic iOS candidate
on:
  workflow_dispatch:
    inputs:
      visual_only:
        description: Recheck native visual rendering after an already verified simulation change
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen
      - run: bash scripts/verify-ios.sh
        env:
          QA_VISUAL_ONLY: ${{ inputs.visual_only }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-simulator-${{ github.sha }}
          path: artifacts/ios-verification/
          retention-days: 7
