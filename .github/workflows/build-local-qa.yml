name: Build iPhone Local-QA IPA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen
      - run: bash scripts/build-local-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-Local-QA-${{ github.sha }}
          path: artifacts/local-qa/
          retention-days: 14
