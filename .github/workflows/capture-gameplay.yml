name: Capture native action screenshots
on: workflow_dispatch
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen
      - run: python3 capture/action-prepare.py
      - run: python3 capture/action-record.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-ASC-action-v058-${{ github.sha }}
          path: artifacts/action-capture/
          retention-days: 30
