name: Capture existing native app for App Store
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: brew install xcodegen
      - name: Download verified original simulator app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35982949271 --repo Krazel/tilt-arena-ios --name TiltArena-simulator-a52788f01b417aae51bebeeee3676d598aa1d198 --dir artifacts/original-simulator
      - run: python3 capture/store-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-ASC-landscape-v058-${{ github.sha }}
          path: |
            artifacts/asc-screenshots/*.json
            artifacts/asc-screenshots/*.log
            artifacts/asc-screenshots/raw/*.png
            artifacts/asc-screenshots/raw/*.json
          retention-days: 30
