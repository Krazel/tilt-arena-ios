name: Tilt Arena TestFlight
on: workflow_dispatch
permissions:
  contents: read
jobs:
  distribute:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: macos-15
    environment: app-store-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm ci && npm test
      - run: brew install xcodegen
      - name: Sign, validate and upload
        run: node scripts/build-testflight.mjs
        env:
          TILT_DISTRIBUTION: testflight
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TiltArena-TestFlight-${{ github.sha }}
          path: artifacts/testflight/
          retention-days: 7
